# OpenELIS database connection
# sqlalchemy_uri is built from env: OPENELIS_DB_*
database_name: Nidan Laboratory
sqlalchemy_uri_placeholder: postgresql://${OPENELIS_DB_USER}:${OPENELIS_DB_PASSWORD}@${OPENELIS_DB_HOST}:${OPENELIS_DB_PORT}/${OPENELIS_DB_NAME}
cache_timeout: null
expose_in_sqllab: true
allow_run_async: false  # No Celery workers - run queries synchronously
allow_csv_upload: false
allow_ctas: false
allow_cvas: false
allow_dml: false
extra: |
  {
    "metadata_params": {},
    "engine_params": {},
    "metadata_cache_timeout": {},
    "schemas_allowed_for_csv_upload": []
  }
