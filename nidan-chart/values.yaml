# ============================================================
# Global
# ============================================================
global:
  namespace: nidan

# ============================================================
# Gateway
# ============================================================
gateway:
  image:
    repository: utsavd/nidan-proxy
    tag: latest
  replicas: 1

# ============================================================
# OpenMRS
# ============================================================
openmrs:
  enabled: true

  db:
    image:
      repository: trigonaltechnology/openmrs-db
      tag: latest
    replicas: 1

  backend:
    image:
      repository: trigonaltechnology/openmrs-backend
      tag: latest
    replicas: 1

  frontend:
    image:
      repository: trigonaltechnology/openmrs-frontend
      tag: latest
    replicas: 1

# ============================================================
# Odoo
# ============================================================
odoo:
  enabled: true
  image:
    repository: trigonaltechnology/nidan_odoo
    tag: latest
  replicas: 1
  db:
    image:
      repository: postgres
      tag: "15"
    replicas: 1

#  ===============================================================
# OpenELIS
openelis:
  enabled: true

  db:
    image:
      repository: trigonaltechnology/openelis-global-2-database
      tag: latest
      pullPolicy: IfNotPresent
    replicas: 1
    storage: 20Gi
    storageClass: ""                # e.g. "longhorn" for multi-node
    resources:
      requests: { cpu: "500m", memory: "1Gi" }
      limits:   { cpu: "2",    memory: "3Gi" }

  backend:
    image:
      repository: trigonaltechnology/openelis-global-2
      tag: latest
      pullPolicy: IfNotPresent
    replicas: 1
    resources:
      requests: { cpu: "500m", memory: "1Gi" }
      limits:   { cpu: "2",    memory: "3Gi" }

  frontend:
    image:
      repository: trigonaltechnology/openelis-global-2-frontend
      tag: latest
      pullPolicy: IfNotPresent
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits:   { cpu: "500m", memory: "512Mi" }

  volume:
    storage: 5Gi
    storageClass: ""                # e.g. "longhorn" for multi-node

  secrets:
    dbPassword: "clinlims"
    integrationDbPassword: "nidan"

# =================================================================
#Orthanc
#=================================================================
orthanc:
  enabled: true

  image:
    repository: orthancteam/orthanc
    tag: "26.6.0"
  replicas: 1

  db:
    image:
      repository: postgres
      tag: "15"
    replicas: 1
  secrets:
    dbPassword: "orthanc"           # ORTHANC_DB_PASSWORD — used by Orthanc to auth to PostgreSQL
    uiPassword: "nidan"             # ORTHANC_PASSWORD   — used for Orthanc HTTP Basic auth
    postgresPassword: "orthanc"     # POSTGRES_PASSWORD  — used by the PostgreSQL container
   
#=======================================================================
#Kafka
#=======================================================================
kafka:
  enabled: true

  zookeeper:
    image:
      repository: confluentinc/cp-zookeeper
      tag: "7.5.0"
    replicas: 1

  broker:
    image:
      repository: confluentinc/cp-kafka
      tag: "7.5.0"
    replicas: 1

#==========================================================================
#CIS-OIS ======================================================
#========================================================================
nidanCisOis:
  enabled: true

  cis:
    image:
      repository: trigonaltechnology/nidan-cis
      tag: latest
    replicas: 1

  ois:
    image:
      repository: trigonaltechnology/nidan-ois
      tag: latest
    replicas: 1

#========================================================
#Nidan-integration=======================================
#======================================================
nidanIntegrationDb:
  enabled: true

  image:
    repository: postgres
    tag: "15"
  replicas: 1

# ============================================================
# Superset
# ============================================================
superset:
  enabled: true

  image:
    repository: trigonaltechnology/superset
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1

  # NodePort for LAN access (30088)
  nodePort: 30088

  # Persistent storage
  storage:
    home: 10Gi           # /app/superset_home — SQLite metadata DB, uploads
    metadata: 1Gi        # /app/superset_metadata — seeded databases/*.yaml + charts/ dashboards/
    storageClass: ""     # e.g. "longhorn" for multi-node clusters

  # Secrets — override in prod via --set or a values-prod.yaml
  secrets:
    secretKey: "SBzPML4hj88VNBdKERD70kFGpQ08gjDGozdFeS3GVJfroaamUGWam5G58mDdvM6J"
    adminPassword: "Nidan123"
    openmrsDbPassword: "openmrs"
    openelisDbPassword: "clinlims"
    odooDbPassword: "nidan"


# ============================================================================================
#Dhis2 
#======================================================================

nidanDhis2:
  enabled: true

  image:
    repository: trigonaltechnology/nidan-dhis2-integration
    tag: latest
  replicas: 1

  db:
    image:
      repository: mysql
      tag: "8.0"
    replicas: 1
