{{- if .Values.superset.enabled }}
# ------------------------------------------------------------
# 0. ConfigMap — superset-config-files (only if manageConfigFiles)
#    Set .Values.superset.manageConfigFiles=true to let Helm own
#    this ConfigMap. Otherwise create it with kubectl (see NOTES).
# ------------------------------------------------------------
{{- if .Values.superset.manageConfigFiles }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: superset-config-files
  namespace: {{ include "nidan.namespace" . }}
data:
  superset_config.py: |
{{ .Files.Get "files/superset_config.py" | indent 4 }}
  init_superset_metadata.py: |
{{ .Files.Get "files/init_superset_metadata.py" | indent 4 }}
  pager.js: |
{{ .Files.Get "files/pager.js" | indent 4 }}
  scroller.js: |
{{ .Files.Get "files/scroller.js" | indent 4 }}
  docker-entrypoint.sh: |
{{ .Files.Get "files/docker-entrypoint.sh" | indent 4 }}
---
{{- end }}

# ------------------------------------------------------------
# 1. ConfigMap — non-secret Superset environment
# ------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: superset-config
  namespace: {{ include "nidan.namespace" . }}
data:
  SUPERSET_ADMIN_USERNAME: "nidan"
  SUPERSET_LOAD_EXAMPLES: "no"
  PYTHONPATH: "/app/pythonpath"

  SUPERSET_WEBSERVER_ADDRESS: "0.0.0.0"
  SUPERSET_WEBSERVER_PORT: "8088"
  SUPERSET_PORT: "8088"

  SUPERSET_APP_ROOT: "/superset"
  SUPERSET_HEALTH_CHECK_ENDPOINT: "/health"

  OPENMRS_DB_HOST: "openmrs-db"
  OPENMRS_DB_PORT: "3306"
  OPENMRS_DB_NAME: "openmrs"
  OPENMRS_DB_USER: "openmrs"

  OPENELIS_DB_HOST: "openelis-db"
  OPENELIS_DB_PORT: "5432"
  OPENELIS_DB_NAME: "clinlims"
  OPENELIS_DB_USER: "clinlims"

  ODOO_DB_HOST: "odoo-db"
  ODOO_DB_PORT: "5432"
  ODOO_DB_NAME: "nidan"
  ODOO_DB_USER: "nidan"

---
# ------------------------------------------------------------
# 2. Secret — Superset secret key, admin password, DB passwords
# ------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: superset-secret
  namespace: {{ include "nidan.namespace" . }}
type: Opaque
stringData:
  SUPERSET_SECRET_KEY: "SBzPML4hj88VNBdKERD70kFGpQ08gjDGozdFeS3GVJfroaamUGWam5G58mDdvM6J"
  SUPERSET_ADMIN_PASSWORD: "Nidan123"
  OPENMRS_DB_PASSWORD: "openmrs"
  OPENELIS_DB_PASSWORD: "clinlims"
  ODOO_DB_PASSWORD: "nidan"

---
# ------------------------------------------------------------
# 3. Service — superset (ClusterIP)
# ------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: superset
  namespace: {{ include "nidan.namespace" . }}
spec:
  type: ClusterIP
  selector:
    app: superset
  ports:
    - name: http
      port: 8088
      targetPort: 8088

---
# ------------------------------------------------------------
# 3b. Service — superset-nodeport
# ------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: superset-nodeport
  namespace: {{ include "nidan.namespace" . }}
spec:
  type: NodePort
  selector:
    app: superset
  ports:
    - name: http
      port: 8088
      targetPort: 8088
      nodePort: 30088

---
# ------------------------------------------------------------
# 4. Deployment — superset
# ------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset
  namespace: {{ include "nidan.namespace" . }}
spec:
  replicas: {{ .Values.superset.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: superset
  template:
    metadata:
      labels:
        app: superset
    spec:
      enableServiceLinks: false

      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"

      initContainers:
        - name: wait-for-dbs
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for openmrs-db:3306..."
              until nc -z openmrs-db 3306; do sleep 3; done
              echo "Waiting for openelis-db:5432..."
              until nc -z openelis-db 5432; do sleep 3; done
              echo "Waiting for odoo-db:5432..."
              until nc -z odoo-db 5432; do sleep 3; done
              echo "All source DBs reachable."

        - name: fix-permissions
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Fixing /app/superset_home ownership..."
              mkdir -p /app/superset_home
              chown -R 1000:0 /app/superset_home
              chmod -R u+rwX,g+rwX /app/superset_home
              echo "Done."
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: superset-home
              mountPath: /app/superset_home

      containers:
        - name: superset
          image: "{{ .Values.superset.image.repository }}:{{ .Values.superset.image.tag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 8088
          envFrom:
            - configMapRef:
                name: superset-config
            - secretRef:
                name: superset-secret
          command: ["/bin/sh", "/app/docker-entrypoint.sh"]
          startupProbe:
            httpGet:
              path: /superset/health
              port: 8088
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /superset/health
              port: 8088
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /superset/health
              port: 8088
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { cpu: "2",    memory: "4Gi" }
          volumeMounts:
            - name: superset-home
              mountPath: /app/superset_home

            - name: superset-config-files
              mountPath: /app/pythonpath/superset_config.py
              subPath: superset_config.py
              readOnly: true
            - name: superset-config-files
              mountPath: /app/pythonpath/init_superset_metadata.py
              subPath: init_superset_metadata.py
              readOnly: true
            - name: superset-config-files
              mountPath: /app/pythonpath/scroller.js
              subPath: scroller.js
              readOnly: true
            - name: superset-config-files
              mountPath: /app/docker-entrypoint.sh
              subPath: docker-entrypoint.sh
              readOnly: true

      volumes:
        - name: superset-home
          persistentVolumeClaim:
            claimName: superset-home
        - name: superset-config-files
          configMap:
            name: superset-config-files
            defaultMode: 0755
        - name: superset-metadata
          persistentVolumeClaim:
            claimName: superset-metadata

---
# ------------------------------------------------------------
# 5. PVCs — superset home and metadata
# ------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: superset-home
  namespace: {{ include "nidan.namespace" . }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: superset-metadata
  namespace: {{ include "nidan.namespace" . }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
{{- end }}
