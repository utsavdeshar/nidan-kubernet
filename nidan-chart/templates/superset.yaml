{{- if .Values.superset.enabled }}
# ============================================================
# NIDAN Superset
# ============================================================

# ------------------------------------------------------------
# 0a. ConfigMap — superset-config-files (3 files)
#     scroller.js / nidan-logo.webp / favicon.ico are baked
#     into the image via Dockerfile, not mounted.
# ------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: superset-config-files
  namespace: {{ include "nidan.namespace" . }}
  labels:
    app.kubernetes.io/part-of: nidan
    app.kubernetes.io/component: superset
data:
  superset_config.py: |
{{ .Files.Get "files/superset/superset_config.py" | indent 4 }}
  init_superset_metadata.py: |
{{ .Files.Get "files/superset/init_superset_metadata.py" | indent 4 }}
  docker-entrypoint.sh: |
{{ .Files.Get "files/superset/docker-entrypoint.sh" | indent 4 }}
  scroller.js: |
{{ .Files.Get "files/superset/scroller.js" | indent 4 }}
---
# ------------------------------------------------------------
# 0b. ConfigMap — superset-metadata-files
#     Helm-rendered copies of files/superset/metadata/databases/*.yaml
#     Seeded into the superset-metadata PVC by the seed-metadata
#     init container on first boot (and re-synced on upgrades if
#     the contents change).
# ------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: superset-metadata-files
  namespace: {{ include "nidan.namespace" . }}
  labels:
    app.kubernetes.io/part-of: nidan
    app.kubernetes.io/component: superset
data:
{{- range $path, $_ := .Files.Glob "files/superset/metadata/databases/*.yaml" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}

---
# ------------------------------------------------------------
# 1. ConfigMap — non-secret Superset environment
# ------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: superset-config
  namespace: {{ include "nidan.namespace" . }}
  labels:
    app.kubernetes.io/part-of: nidan
    app.kubernetes.io/component: superset
data:
  SUPERSET_ADMIN_USERNAME: "nidan"
  SUPERSET_LOAD_EXAMPLES: "no"
  PYTHONPATH: "/app/pythonpath"

  SUPERSET_WEBSERVER_ADDRESS: "0.0.0.0"
  SUPERSET_WEBSERVER_PORT: "8088"
  SUPERSET_PORT: "8088"

  SUPERSET_APP_ROOT: "/superset"
  SUPERSET_HEALTH_CHECK_ENDPOINT: "/health"

  OPENMRS_DB_HOST: "openmrs-db"
  OPENMRS_DB_PORT: "3306"
  OPENMRS_DB_NAME: "openmrs"
  OPENMRS_DB_USER: "openmrs"

  OPENELIS_DB_HOST: "openelis-db"
  OPENELIS_DB_PORT: "5432"
  OPENELIS_DB_NAME: "clinlims"
  OPENELIS_DB_USER: "clinlims"

  ODOO_DB_HOST: "odoo-db"
  ODOO_DB_PORT: "5432"
  ODOO_DB_NAME: "nidan"
  ODOO_DB_USER: "nidan"

  SUPERSET_METADATA_DIR: "/app/superset_metadata"

---
# ------------------------------------------------------------
# 2. Secret — Superset secret key, admin password, DB passwords
# ------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: superset-secret
  namespace: {{ include "nidan.namespace" . }}
  labels:
    app.kubernetes.io/part-of: nidan
    app.kubernetes.io/component: superset
type: Opaque
stringData:
  SUPERSET_SECRET_KEY: {{ .Values.superset.secrets.secretKey | quote }}
  SUPERSET_ADMIN_PASSWORD: {{ .Values.superset.secrets.adminPassword | quote }}
  OPENMRS_DB_PASSWORD: {{ .Values.superset.secrets.openmrsDbPassword | quote }}
  OPENELIS_DB_PASSWORD: {{ .Values.superset.secrets.openelisDbPassword | quote }}
  ODOO_DB_PASSWORD: {{ .Values.superset.secrets.odooDbPassword | quote }}

---
# ------------------------------------------------------------
# 3. Service — superset (ClusterIP)
# ------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: superset
  namespace: {{ include "nidan.namespace" . }}
  labels:
    app.kubernetes.io/part-of: nidan
    app.kubernetes.io/component: superset
spec:
  type: ClusterIP
  selector:
    app: superset
  ports:
    - name: http
      port: 8088
      targetPort: 8088

---
# ------------------------------------------------------------
# 3b. Service — superset-nodeport
# ------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: superset-nodeport
  namespace: {{ include "nidan.namespace" . }}
  labels:
    app.kubernetes.io/part-of: nidan
    app.kubernetes.io/component: superset
spec:
  type: NodePort
  selector:
    app: superset
  ports:
    - name: http
      port: 8088
      targetPort: 8088
      nodePort: {{ .Values.superset.nodePort }}

---
# ------------------------------------------------------------
# 4. Deployment — superset
# ------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset
  namespace: {{ include "nidan.namespace" . }}
  labels:
    app.kubernetes.io/part-of: nidan
    app.kubernetes.io/component: superset
spec:
  replicas: {{ .Values.superset.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: superset
  template:
    metadata:
      labels:
        app: superset
    spec:
      enableServiceLinks: false

      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"

      initContainers:
        - name: wait-for-dbs
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for openmrs-db:3306..."
              until nc -z openmrs-db 3306; do sleep 3; done
              echo "Waiting for openelis-db:5432..."
              until nc -z openelis-db 5432; do sleep 3; done
              echo "Waiting for odoo-db:5432..."
              until nc -z odoo-db 5432; do sleep 3; done
              echo "All source DBs reachable."

        # Seed/update the metadata PVC from the ConfigMap.
        # - Creates the three expected subdirectories (charts/, dashboards/, databases/)
        # - Copies every YAML from /seed into /app/superset_metadata/databases/
        #   ONLY if the content differs (cmp -s) — so unchanged files are untouched
        #   and pod restarts are cheap.
        # - Preserves whatever Superset writes back into charts/ and dashboards/.
        - name: seed-metadata
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              TARGET=/app/superset_metadata
              echo "Preparing $TARGET..."
              mkdir -p "$TARGET/charts" "$TARGET/dashboards" "$TARGET/databases"

              echo "Seeding databases/*.yaml from ConfigMap..."
              for f in /seed/*.yaml; do
                [ -f "$f" ] || continue
                base=$(basename "$f")
                dest="$TARGET/databases/$base"
                if [ ! -f "$dest" ] || ! cmp -s "$f" "$dest"; then
                  cp "$f" "$dest"
                  echo "  copied: $base"
                else
                  echo "  unchanged: $base"
                fi
              done

              chown -R 1000:0 "$TARGET"
              chmod -R u+rwX,g+rwX "$TARGET"
              echo "Done. Final tree:"
              ls -la "$TARGET"
              ls -la "$TARGET/databases"
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: superset-metadata
              mountPath: /app/superset_metadata
            - name: superset-metadata-seed
              mountPath: /seed
              readOnly: true

        - name: fix-permissions
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Fixing /app/superset_home ownership..."
              mkdir -p /app/superset_home
              chown -R 1000:0 /app/superset_home
              chmod -R u+rwX,g+rwX /app/superset_home
              echo "Done."
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: superset-home
              mountPath: /app/superset_home

      containers:
        - name: superset
          image: "{{ .Values.superset.image.repository }}:{{ .Values.superset.image.tag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 8088
          envFrom:
            - configMapRef:
                name: superset-config
            - secretRef:
                name: superset-secret
          command: ["/bin/sh", "/app/docker-entrypoint.sh"]
          startupProbe:
            httpGet:
              path: /superset/health
              port: 8088
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /superset/health
              port: 8088
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /superset/health
              port: 8088
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { cpu: "2",    memory: "4Gi" }
          volumeMounts:
            - name: superset-home
              mountPath: /app/superset_home

            # Metadata PVC (seeded by the init container above)
            - name: superset-metadata
              mountPath: /app/superset_metadata

            - name: superset-config-files
              mountPath: /app/pythonpath/superset_config.py
              subPath: superset_config.py
              readOnly: true
            - name: superset-config-files
              mountPath: /app/pythonpath/init_superset_metadata.py
              subPath: init_superset_metadata.py
              readOnly: true
            - name: superset-config-files
              mountPath: /app/pythonpath/scroller.js
              subPath: scroller.js
              readOnly: true
            - name: superset-config-files
              mountPath: /app/docker-entrypoint.sh
              subPath: docker-entrypoint.sh
              readOnly: true

      volumes:
        - name: superset-home
          persistentVolumeClaim:
            claimName: superset-home
        - name: superset-metadata
          persistentVolumeClaim:
            claimName: superset-metadata
        - name: superset-metadata-seed
          configMap:
            name: superset-metadata-files
        - name: superset-config-files
          configMap:
            name: superset-config-files
            defaultMode: 0755

---
# ------------------------------------------------------------
# 5. PVCs
# ------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: superset-home
  namespace: {{ include "nidan.namespace" . }}
  labels:
    app.kubernetes.io/part-of: nidan
    app.kubernetes.io/component: superset
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.superset.storage.storageClass }}
  storageClassName: {{ .Values.superset.storage.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.superset.storage.home }}

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: superset-metadata
  namespace: {{ include "nidan.namespace" . }}
  labels:
    app.kubernetes.io/part-of: nidan
    app.kubernetes.io/component: superset
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.superset.storage.storageClass }}
  storageClassName: {{ .Values.superset.storage.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.superset.storage.metadata }}
{{- end }}
