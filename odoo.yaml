# ============================================================
# Odoo + Odoo DB — Production Kubernetes manifest
# Namespace: nidan
# ------------------------------------------------------------
# One-shot install:
#   kubectl apply -f nidan-odoo.yaml -n nidan
#
# What happens automatically:
#   1. odoo-db StatefulSet starts, runs init-odoo-db.sh to
#      create the "nidan" DB + "odoo" user.
#   2. odoo-init Job waits for the DB, then installs the
#      "web" module (and any other core modules) with
#      --stop-after-init.
#   3. odoo Deployment starts, waits for the DB, and serves
#      the login page.
#
# Production features:
#   - Config validated (odoo.conf has full DB block)
#   - One-shot init Job (idempotent, re-runnable)
#   - No more -u all in the serving pod (fast restarts)
#   - Startup probe (long grace for first boot)
#   - Resource requests + limits
#   - Cleaned-up probes with sensible timeouts
#   - NodePort for LAN access on 30069
#   - Removed --dev=xml (production)
#   - enableServiceLinks: false (avoids KAFKA_* collisions)
# ============================================================

# ------------------------------------------------------------
# 1. ConfigMap — non-secret environment values
# ------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: odoo-config
  namespace: nidan
data:
  ODOO_DB_NAME: "nidan"
  ODOO_DB_HOST: "odoo-db"
  ODOO_DB_USER: "odoo"
  ODOO_DB_PORT: "5432"
  ODOO_POSTGRES_DB: "postgres"
  ODOO_POSTGRES_USER: "odoo"
  ODOO_ADMIN_EMAIL: "nidan"
  ODOO_ADMIN_PASSWORD: "nidan"
  ODOO_WEB_BASE_URL: "http://localhost:8069"
  ODOO_WEB_BASE_URL_FREEZE: "True"
  ODOO_DB_FILTER: "^nidan$"
  NIDAN_OIS_URL: "http://nidan-cis:8081"
  NIDAN_OIS_SECRET: "sample"
  NIDAN_ODOO_SECRET: "sample"

---
# ------------------------------------------------------------
# 2. Secret — passwords
# ------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: odoo-secret
  namespace: nidan
type: Opaque
stringData:
  ODOO_DB_PASSWORD: "odoo"
  ODOO_POSTGRES_PASSWORD: "odoo"

---
# ------------------------------------------------------------
# 3. ConfigMap — odoo.conf + init-odoo-db.sh
# ------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: odoo-config-files
  namespace: nidan
data:
  odoo.conf: |
    [options]
    addons_path = /mnt/extra-addons,/mnt/private-addons,/usr/lib/python3/dist-packages/odoo/addons
    db_host = odoo-db
    db_port = 5432
    db_user = odoo
    db_password = odoo
    db_name = nidan
    dbfilter = ^nidan$
    proxy_mode = True
    list_db = False
    admin_passwd = nidan
    http_interface = 0.0.0.0
    http_port = 8069
    workers = 2
    max_cron_threads = 1
    limit_memory_soft = 1610612736
    limit_memory_hard = 2684354560
    limit_time_cpu = 600
    limit_time_real = 1200

  init-odoo-db.sh: |
    #!/bin/bash
    set -e

    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-EOSQL
      CREATE USER ${ODOO_DB_USER} WITH PASSWORD '${ODOO_DB_PASSWORD}' CREATEDB;
      CREATE DATABASE ${ODOO_DB_NAME} OWNER ${ODOO_DB_USER};
      GRANT ALL PRIVILEGES ON DATABASE ${ODOO_DB_NAME} TO ${ODOO_DB_USER};
    EOSQL

---
# ------------------------------------------------------------
# 4. Service — odoo-db
# ------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: odoo-db
  namespace: nidan
spec:
  type: ClusterIP
  selector:
    app: odoo-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

---
# ------------------------------------------------------------
# 5. StatefulSet — odoo-db
# ------------------------------------------------------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: odoo-db
  namespace: nidan
spec:
  serviceName: odoo-db
  replicas: 1
  selector:
    matchLabels:
      app: odoo-db
  template:
    metadata:
      labels:
        app: odoo-db
    spec:
      enableServiceLinks: false
      containers:
        - name: odoo-db
          image: postgres:15
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: odoo-config, key: ODOO_POSTGRES_DB } }
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: odoo-config, key: ODOO_POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef:    { name: odoo-secret, key: ODOO_POSTGRES_PASSWORD } }
            - name: ODOO_DB_NAME
              valueFrom: { configMapKeyRef: { name: odoo-config, key: ODOO_DB_NAME } }
            - name: ODOO_DB_USER
              valueFrom: { configMapKeyRef: { name: odoo-config, key: ODOO_DB_USER } }
            - name: ODOO_DB_PASSWORD
              valueFrom: { secretKeyRef:    { name: odoo-secret, key: ODOO_DB_PASSWORD } }
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
          readinessProbe:
            exec: { command: [ "sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\"" ] }
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec: { command: [ "sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\"" ] }
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "1",    memory: "2Gi" }
          volumeMounts:
            - name: odoo-db-data
              mountPath: /var/lib/postgresql/data
            - name: odoo-db-init
              mountPath: /docker-entrypoint-initdb.d/init-odoo-db.sh
              subPath: init-odoo-db.sh
              readOnly: true
      volumes:
        - name: odoo-db-init
          configMap:
            name: odoo-config-files
            defaultMode: 0755
            items:
              - key: init-odoo-db.sh
                path: init-odoo-db.sh
  volumeClaimTemplates:
    - metadata:
        name: odoo-db-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi

---
# ------------------------------------------------------------
# 6. Service — odoo (ClusterIP)
# ------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: odoo
  namespace: nidan
spec:
  type: ClusterIP
  selector:
    app: odoo
  ports:
    - name: http
      port: 8069
      targetPort: 8069

---
# ------------------------------------------------------------
# 6b. Service — odoo-nodeport (LAN access on 30069)
# ------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: odoo-nodeport
  namespace: nidan
spec:
  type: NodePort
  selector:
    app: odoo
  ports:
    - name: http
      port: 8069
      targetPort: 8069
      nodePort: 30069

---
# ------------------------------------------------------------
# 7. Job — one-shot Odoo DB initialization
#    Installs the "web" module so the login page exists.
#    Idempotent: re-running skips already-installed modules.
# ------------------------------------------------------------
apiVersion: batch/v1
kind: Job
metadata:
  name: odoo-init
  namespace: nidan
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: odoo-init
    spec:
      enableServiceLinks: false
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-odoo-db
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for odoo-db:5432..."
              until nc -z odoo-db 5432; do
                echo "  still waiting..."
                sleep 3
              done
              echo "odoo-db is up."
      containers:
        - name: odoo-init
          image: trigonaltechnology/nidan_odoo:latest
          imagePullPolicy: IfNotPresent
          command:
            - odoo
            - -d
            - "$(ODOO_DB_NAME)"
            - -i
            - web
            - --stop-after-init
            - --no-http
          env:
            - name: HOST
              valueFrom: { configMapKeyRef: { name: odoo-config, key: ODOO_DB_HOST } }
            - name: USER
              valueFrom: { configMapKeyRef: { name: odoo-config, key: ODOO_DB_USER } }
            - name: PASSWORD
              valueFrom: { secretKeyRef:    { name: odoo-secret, key: ODOO_DB_PASSWORD } }
            - name: PORT
              valueFrom: { configMapKeyRef: { name: odoo-config, key: ODOO_DB_PORT } }
            - name: ODOO_DB_NAME
              valueFrom: { configMapKeyRef: { name: odoo-config, key: ODOO_DB_NAME } }
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: odoo-config, key: ODOO_POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef:    { name: odoo-secret, key: ODOO_POSTGRES_PASSWORD } }
          volumeMounts:
            - name: odoo-conf
              mountPath: /etc/odoo/odoo.conf
              subPath: odoo.conf
              readOnly: true
      volumes:
        - name: odoo-conf
          configMap:
            name: odoo-config-files
            items:
              - key: odoo.conf
                path: odoo.conf

---
# ------------------------------------------------------------
# 8. Deployment — odoo (serving)
#    No -u all. The Job handles module init/updates.
#    Starts fast and stays healthy.
# ------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo
  namespace: nidan
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: odoo
  template:
    metadata:
      labels:
        app: odoo
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-odoo-db
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for odoo-db:5432..."
              until nc -z odoo-db 5432; do
                echo "  still waiting..."
                sleep 3
              done
              echo "odoo-db is up."
      containers:
        - name: odoo
          image: trigonaltechnology/nidan_odoo:latest
          imagePullPolicy: IfNotPresent
          command:
            - odoo
            - -d
            - "$(ODOO_DB_NAME)"
            - --proxy-mode
          ports:
            - name: http
              containerPort: 8069
          env:
            - name: HOST
              valueFrom: { configMapKeyRef: { name: odoo-config, key: ODOO_DB_HOST } }
            - name: USER
              valueFrom: { configMapKeyRef: { name: odoo-config, key: ODOO_DB_USER } }
            - name: PASSWORD
              valueFrom: { secretKeyRef:    { name: odoo-secret, key: ODOO_DB_PASSWORD } }
            - name: PORT
              valueFrom: { configMapKeyRef: { name: odoo-config, key: ODOO_DB_PORT } }
            - name: ODOO_DB_NAME
              valueFrom: { configMapKeyRef: { name: odoo-config, key: ODOO_DB_NAME } }
            - name: ODOO_ADMIN_EMAIL
              valueFrom: { configMapKeyRef: { name: odoo-config, key: ODOO_ADMIN_EMAIL } }
            - name: ODOO_ADMIN_PASSWORD
              valueFrom: { configMapKeyRef: { name: odoo-config, key: ODOO_ADMIN_PASSWORD } }
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: odoo-config, key: ODOO_POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef:    { name: odoo-secret, key: ODOO_POSTGRES_PASSWORD } }
            - name: NIDAN_OIS_URL
              valueFrom: { configMapKeyRef: { name: odoo-config, key: NIDAN_OIS_URL } }
            - name: NIDAN_OIS_SECRET
              valueFrom: { configMapKeyRef: { name: odoo-config, key: NIDAN_OIS_SECRET } }
            - name: NIDAN_ODOO_SECRET
              valueFrom: { configMapKeyRef: { name: odoo-config, key: NIDAN_ODOO_SECRET } }
            - name: ODOO_WEB_BASE_URL
              valueFrom: { configMapKeyRef: { name: odoo-config, key: ODOO_WEB_BASE_URL } }
            - name: ODOO_WEB_BASE_URL_FREEZE
              valueFrom: { configMapKeyRef: { name: odoo-config, key: ODOO_WEB_BASE_URL_FREEZE } }
            - name: ODOO_DB_FILTER
              valueFrom: { configMapKeyRef: { name: odoo-config, key: ODOO_DB_FILTER } }
          startupProbe:
            httpGet: { path: /web/health, port: 8069 }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /web/health, port: 8069 }
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /web/health, port: 8069 }
            initialDelaySeconds: 0
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { cpu: "2",    memory: "3Gi" }
          volumeMounts:
            - name: odoo-data
              mountPath: /var/lib/odoo
            - name: odoo-conf
              mountPath: /etc/odoo/odoo.conf
              subPath: odoo.conf
              readOnly: true
      volumes:
        - name: odoo-conf
          configMap:
            name: odoo-config-files
            items:
              - key: odoo.conf
                path: odoo.conf
        - name: odoo-data
          persistentVolumeClaim:
            claimName: odoo-data

---
# ------------------------------------------------------------
# 9. PVC — odoo-data
# ------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: odoo-data
  namespace: nidan
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
