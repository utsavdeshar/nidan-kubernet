# ============================================================
# OpenELIS + NIDAN Integration — Kubernetes manifest
# Namespace: nidan
# ------------------------------------------------------------
# Resources created:
#   1. ConfigMap  openelis-config
#   2. Secret     openelis-secret
#   3. ConfigMap  openelis-config-files   (server.xml, common.properties placeholders)
#   4. Service    openelis-db
#   5. StatefulSet openelis-db
#   6. Service    openelis
#   7. Deployment  openelis
#   8. Service    openelis-frontend
#   9. Deployment  openelis-frontend
#  10. Service    nidan-integration-db
#  11. StatefulSet nidan-integration-db
# ============================================================

# ------------------------------------------------------------
# 1. ConfigMap — non-secret environment values
# ------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: openelis-config
  namespace: nidan
data:
  OPENELIS_DB_NAME: "clinlims"
  OPENELIS_DB_USER: "postgres"
  OPENELIS_DB_PORT: "5432"
  OPENELIS_TZ: "UTC"
  OPENELIS_DEFAULT_ADMIN_PASSWORD: "adminADMIN!"
  CIS_BASE_URL: "http://nidan-cis:8081"
  OPENELIS_MIDDLEWARE_TEST_SYNC_ENABLED: "false"
  OPENELIS_MIDDLEWARE_SYNC_SECRET: "change-me"
  OPENELIS_MIDDLEWARE_RESULT_SYNC_ENABLED: "true"
  OPENELIS_NIDAN_TESTORDER_ENABLED: "true"
  OPENELIS_NIDAN_PAYWALL_ENABLED: "true"
  NIDANCORE_ODOO_URL: "http://odoo:8069"
  OPENELIS_NIDAN_PAYWALL_INSURANCE_BYPASS: "true"
  NIDAN_ODOO_SECRET: "change-me"
  INTEGRATION_DB_NAME: "nidan_integration"
  INTEGRATION_DB_USER: "nidan"

---
# ------------------------------------------------------------
# 2. Secret — passwords
# ------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: openelis-secret
  namespace: nidan
type: Opaque
stringData:
  OPENELIS_DB_PASSWORD: "clinlims"
  INTEGRATION_DB_PASSWORD: "nidan"

---
# ------------------------------------------------------------
# 3. ConfigMap — file contents mounted into the OpenELIS backend
#    Replace the placeholder values with the real contents of
#    ./openelis/tomcat/server.xml and
#    ./openelis/volume/properties/common.properties
# ------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: openelis-config-files
  namespace: nidan
data:
  server.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!-- Replace with the contents of ./openelis/tomcat/server.xml -->
    <Server port="8005" shutdown="SHUTDOWN">
      <Service name="Catalina">
        <Connector port="8080" protocol="HTTP/1.1"
                   connectionTimeout="20000"
                   redirectPort="8443" />
        <Engine name="Catalina" defaultHost="localhost">
          <Host name="localhost" appBase="webapps"
                unpackWARs="true" autoDeploy="true">
          </Host>
        </Engine>
      </Service>
    </Server>

  common.properties: |
    # Replace with the contents of ./openelis/volume/properties/common.properties
    # These keys are typically consumed by the OpenELIS app at startup.
    datasource.url=jdbc:postgresql://openelis-db:5432/clinlims
    datasource.username=clinlims
    datasource.password=clinlims

---
# ------------------------------------------------------------
# 4. Service — openelis-db
# ------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: openelis-db
  namespace: nidan
spec:
  type: ClusterIP
  selector:
    app: openelis-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

---
# ------------------------------------------------------------
# 5. StatefulSet — openelis-db
# ------------------------------------------------------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openelis-db
  namespace: nidan
spec:
  serviceName: openelis-db
  replicas: 1
  selector:
    matchLabels:
      app: openelis-db
  template:
    metadata:
      labels:
        app: openelis-db
    spec:
      containers:
        - name: openelis-db
          image: trigonaltechnology/openelis-global-2-database:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: openelis-config
                  key: OPENELIS_DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: openelis-config
                  key: OPENELIS_DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openelis-secret
                  key: OPENELIS_DB_PASSWORD
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openelis-secret
                  key: OPENELIS_DB_PASSWORD
            - name: DB_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openelis-secret
                  key: OPENELIS_DB_PASSWORD
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: openelis-db-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: openelis-db-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi

---
# ------------------------------------------------------------
# 6. Service — openelis (backend)
# ------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: openelis
  namespace: nidan
spec:
  type: ClusterIP
  selector:
    app: openelis
  ports:
    - name: http
      port: 8080
      targetPort: 8080

---
# ------------------------------------------------------------
# 7. Deployment — openelis (backend)
# ------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openelis
  namespace: nidan
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openelis
  template:
    metadata:
      labels:
        app: openelis
    spec:
      initContainers:
        - name: wait-for-openelis-db
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for openelis-db:5432..."
              until nc -z openelis-db 5432; do
                echo "  still waiting..."
                sleep 3
              done
              echo "openelis-db is up."
      containers:
        - name: openelis
          image: trigonaltechnology/openelis-global-2:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DEFAULT_PW
              valueFrom:
                configMapKeyRef:
                  name: openelis-config
                  key: OPENELIS_DEFAULT_ADMIN_PASSWORD
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: openelis-config
                  key: OPENELIS_TZ
            - name: ODOO_ENABLED
              value: "false"
            - name: ORG_OPENELISGLOBAL_ODOO_ENABLED
              value: "false"
            - name: OPENELIS_ENABLE_HTTPS
              value: "false"

            # ---- values referenced by CATALINA_OPTS ----
            - name: OPENELIS_DB_NAME
              valueFrom: { configMapKeyRef: { name: openelis-config, key: OPENELIS_DB_NAME } }
            - name: OPENELIS_DB_USER
              valueFrom: { configMapKeyRef: { name: openelis-config, key: OPENELIS_DB_USER } }
            - name: OPENELIS_DB_PASSWORD
              valueFrom: { secretKeyRef:    { name: openelis-secret, key: OPENELIS_DB_PASSWORD } }
            - name: OPENELIS_MIDDLEWARE_TEST_SYNC_ENABLED
              valueFrom: { configMapKeyRef: { name: openelis-config, key: OPENELIS_MIDDLEWARE_TEST_SYNC_ENABLED } }
            - name: OPENELIS_MIDDLEWARE_SYNC_SECRET
              valueFrom: { configMapKeyRef: { name: openelis-config, key: OPENELIS_MIDDLEWARE_SYNC_SECRET } }
            - name: OPENELIS_MIDDLEWARE_RESULT_SYNC_ENABLED
              valueFrom: { configMapKeyRef: { name: openelis-config, key: OPENELIS_MIDDLEWARE_RESULT_SYNC_ENABLED } }
            - name: OPENELIS_NIDAN_TESTORDER_ENABLED
              valueFrom: { configMapKeyRef: { name: openelis-config, key: OPENELIS_NIDAN_TESTORDER_ENABLED } }
            - name: OPENELIS_NIDAN_PAYWALL_ENABLED
              valueFrom: { configMapKeyRef: { name: openelis-config, key: OPENELIS_NIDAN_PAYWALL_ENABLED } }
            - name: OPENELIS_NIDAN_PAYWALL_INSURANCE_BYPASS
              valueFrom: { configMapKeyRef: { name: openelis-config, key: OPENELIS_NIDAN_PAYWALL_INSURANCE_BYPASS } }
            - name: NIDANCORE_ODOO_URL
              valueFrom: { configMapKeyRef: { name: openelis-config, key: NIDANCORE_ODOO_URL } }
            - name: NIDAN_ODOO_SECRET
              valueFrom: { configMapKeyRef: { name: openelis-config, key: NIDAN_ODOO_SECRET } }
            - name: CIS_BASE_URL
              valueFrom: { configMapKeyRef: { name: openelis-config, key: CIS_BASE_URL } }

            - name: CATALINA_OPTS
              value: >-
                -Ddatasource.url=jdbc:postgresql://openelis-db:5432/$(OPENELIS_DB_NAME)
                -Ddatasource.username=$(OPENELIS_DB_USER)
                -Ddatasource.password=$(OPENELIS_DB_PASSWORD)
                -Dorg.openelisglobal.middleware.test.sync.enabled=$(OPENELIS_MIDDLEWARE_TEST_SYNC_ENABLED)
                -Dorg.openelisglobal.middleware.test.sync.url=$(CIS_BASE_URL)/openelis/catalog/lab-test-definition
                -Dorg.openelisglobal.middleware.test.sync.secret=$(OPENELIS_MIDDLEWARE_SYNC_SECRET)
                -Dorg.openelisglobal.middleware.result.sync.enabled=$(OPENELIS_MIDDLEWARE_RESULT_SYNC_ENABLED)
                -Dorg.openelisglobal.middleware.result.sync.url=$(CIS_BASE_URL)/openelis/lab-result
                -Dorg.openelisglobal.middleware.result.sync.secret=$(OPENELIS_MIDDLEWARE_SYNC_SECRET)
                -Dorg.openelisglobal.nidan.testorder.enabled=$(OPENELIS_NIDAN_TESTORDER_ENABLED)
                -Dorg.openelisglobal.nidan.testorder.url=$(CIS_BASE_URL)/openelis/sample-collected
                -Dorg.openelisglobal.nidan.paywall.enabled=$(OPENELIS_NIDAN_PAYWALL_ENABLED)
                -Dorg.openelisglobal.nidan.paywall.odoo.url=$(NIDANCORE_ODOO_URL)
                -Dorg.openelisglobal.nidan.paywall.odoo.secret=$(NIDAN_ODOO_SECRET)
                -Dorg.openelisglobal.nidan.paywall.insurance.bypass=$(OPENELIS_NIDAN_PAYWALL_INSURANCE_BYPASS)
                -Dorg.openelisglobal.nidan.cisretry.list.url=$(CIS_BASE_URL)/api/dead-letters
                -Dorg.openelisglobal.nidan.cisretry.retry.url=$(CIS_BASE_URL)/api/dead-letters/retry
          readinessProbe:
            httpGet:
              path: /OpenELIS-Global/
              port: 8080
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /OpenELIS-Global/
              port: 8080
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "3Gi"
          volumeMounts:
            - name: openelis-server-xml
              mountPath: /usr/local/tomcat/conf/server.xml
              subPath: server.xml
            - name: openelis-common-props
              mountPath: /run/secrets/common.properties
              subPath: common.properties
            - name: openelis-properties
              mountPath: /var/lib/openelis-global/properties
            - name: openelis-lucene-index
              mountPath: /var/lib/lucene_index
      volumes:
        - name: openelis-server-xml
          configMap:
            name: openelis-config-files
            items:
              - key: server.xml
                path: server.xml
        - name: openelis-common-props
          configMap:
            name: openelis-config-files
            items:
              - key: common.properties
                path: common.properties
        - name: openelis-properties
          emptyDir: {}
        - name: openelis-lucene-index
          emptyDir: {}

---
# ------------------------------------------------------------
# 8. Service — openelis-frontend
# ------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: openelis-frontend
  namespace: nidan
spec:
  type: ClusterIP
  selector:
    app: openelis-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80

---
# ------------------------------------------------------------
# 9. Deployment — openelis-frontend
# ------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openelis-frontend
  namespace: nidan
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openelis-frontend
  template:
    metadata:
      labels:
        app: openelis-frontend
    spec:
      containers:
        - name: openelis-frontend
          image: trigonaltechnology/openelis-global-2-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: CHOKIDAR_USEPOLLING
              value: "true"
            - name: PUBLIC_URL
              value: "/openelis"
            - name: REACT_APP_BASE_PATH
              value: "/openelis"
            - name: REACT_APP_SERVER_BASE
              value: "/api/OpenELIS-Global"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
# ------------------------------------------------------------
# 10. Service — nidan-integration-db
# ------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: nidan-integration-db
  namespace: nidan
spec:
  type: ClusterIP
  selector:
    app: nidan-integration-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

