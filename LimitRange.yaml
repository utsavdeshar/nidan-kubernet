apiVersion: v1
kind: LimitRange
metadata:
  name: nidan-defaults
  namespace: nidan
spec:
  limits:
    - default:          # Applied if no limit is set
        cpu: "500m"
        memory: "1Gi"
      defaultRequest:   # Applied if no request is set
        cpu: "200m"
        memory: "256Mi"
      max:              # Hard ceiling per pod
        cpu: "2"
        memory: "3Gi"
      type: Container
