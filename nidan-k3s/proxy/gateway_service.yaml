apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: nidan
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local

  selector:
    app: gateway

  ports:
    - name: http
      port: 80
      targetPort: 80

    - name: https
      port: 443
      targetPort: 443

    - name: gateway-8443
      port: 8443
      targetPort: 8443
